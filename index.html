
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowFame Login</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #071225;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 390px;
  padding: 28px 22px;
  border-radius: 18px;
  background: #10213b;
  text-align: center;
  border: 1px solid #263b5b;
}

h1 { color: #48a5ff; }

p { color: #bdc9dc; }

input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #526581;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.primary { background: #2587ee; color: white; }
.google { background: white; color: #222; }
.secondary { background: #263b5b; color: white; }

#status {
  overflow-wrap: anywhere;
  font-size: 14px;
  margin-top: 15px;
}

#otpSection, #accountSection { display: none; }
</style>
</head>

<body>

<div class="card">
  <h1>GrowFame</h1>
  <p>Grow Your Fame. Build Your Business.</p>

  <div id="loginSection">
    <h2>Welcome!</h2>
    <p>Login with your mobile number</p>

    <input id="phone"
      type="tel"
      placeholder="+91 Mobile Number">

    <div id="recaptcha-container"></div>

    <button class="primary" id="sendOtp">
      Send OTP
    </button>

    <p>OR</p>

    <button class="google" id="googleLogin">
      Continue with Google
    </button>
  </div>

  <div id="otpSection">
    <h2>Verify OTP</h2>
    <input id="otp" type="text"
      inputmode="numeric"
      placeholder="Enter 6 digit OTP"
      maxlength="6">

    <button class="primary" id="verifyOtp">
      Verify & Login
    </button>
  </div>

  <div id="accountSection">
    <h2>Login Successful!</h2>
    <p id="userInfo"></p>
    <button class="secondary" id="logout">
      Logout
    </button>
  </div>

  <p id="status">Please login to continue.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyByoCMgGHRNhDio6EHBBd_Tpany5Myr15g",
  authDomain: "growfame-4ef72.firebaseapp.com",
  projectId: "growfame-4ef72",
  storageBucket: "growfame-4ef72.firebasestorage.app",
  messagingSenderId: "368004607622",
  appId: "1:368004607622:web:3e4e4505ac2ab7d84f2b07",
  measurementId: "G-GQT6VWVJYQ"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let confirmationResult = null;
let recaptchaVerifier = null;

const statusText = document.getElementById("status");

document.getElementById("sendOtp").onclick = async () => {
  const phone = document.getElementById("phone").value.trim();

  if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
    statusText.textContent =
      "Enter number with country code, e.g. +919876543210";
    return;
  }

  try {
    statusText.textContent = "Preparing verification...";

    if (!recaptchaVerifier) {
      recaptchaVerifier =
        new firebase.auth.RecaptchaVerifier(
          "recaptcha-container",
          { size: "normal" }
        );
      await recaptchaVerifier.render();
    }

    confirmationResult =
      await auth.signInWithPhoneNumber(
        phone, recaptchaVerifier
      );

    document.getElementById("otpSection").style.display = "block";
    statusText.textContent = "OTP sent. Check your SMS.";
  } catch (error) {
    statusText.textContent = error.message;
    if (recaptchaVerifier) {
      recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }
  }
};

document.getElementById("verifyOtp").onclick = async () => {
  const code = document.getElementById("otp").value.trim();

  if (!confirmationResult || !code) {
    statusText.textContent = "Enter the OTP first.";
    return;
  }

  try {
    await confirmationResult.confirm(code);
  } catch (error) {
    statusText.textContent = error.message;
  }
};

document.getElementById("googleLogin").onclick = async () => {
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    await auth.signInWithRedirect(provider);
  } catch (error) {
    statusText.textContent = error.message;
  }
};

auth.getRedirectResult().catch(error => {
  statusText.textContent = error.message;
});

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("otpSection").style.display = "none";
    document.getElementById("accountSection").style.display = "block";

    document.getElementById("userInfo").textContent =
      user.displayName || user.phoneNumber || user.email;

    statusText.textContent = "You are logged in!";
  } else {
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("accountSection").style.display = "none";
  }
});

document.getElementById("logout").onclick = async () => {
  await auth.signOut();
  document.getElementById("otpSection").style.display = "none";
  statusText.textContent = "You have logged out.";
};
</script>

</body>
</html>
